<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>寶貝的榮譽徽章收藏館</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="皇家收藏館"> <link rel="apple-touch-icon" href="icon.png"> 
    <link rel="icon" type="image/png" href="icon.png">
    
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <style>
        :root {
            --primary-color: #FF7B94;
            --bg-color: #FFF5F7;
            --gold: #FFD700;
        }
        body {
            font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif;
            background-color: var(--bg-color);
            margin: 0; padding: 15px; text-align: center; color: #4A4A4A;
            user-select: none; -webkit-user-select: none; touch-action: manipulation;
        }
        h1 { color: var(--primary-color); font-size: 1.8rem; margin: 10px 0 5px 0; text-shadow: 1px 1px 2px white; }
        .subtitle { font-size: 1rem; color: #666; margin-bottom: 20px; }
        
        .section-title { font-size: 1.2rem; font-weight: bold; color: var(--primary-color); text-align: left; max-width: 500px; margin: 10px auto; padding-left: 10px; }
        .task-container { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; margin-bottom: 25px; }
        .task-card {
            background: white; border: 3px solid #FFE0E6; border-radius: 20px; padding: 12px 8px; width: 85px;
            box-shadow: 0 6px 12px rgba(0,0,0,0.05); cursor: pointer; transition: all 0.2s; position: relative;
        }
        .task-card:active { transform: scale(0.95); }
        .task-card.completed { background: #E8F5E9; border-color: #81C784; opacity: 0.8; }
        .task-icon { font-size: 2.2rem; margin-bottom: 5px; }
        .task-name { font-size: 0.85rem; font-weight: bold; white-space: nowrap; }
        .check-badge { position: absolute; top: -5px; right: -5px; background: #4CAF50; color: white; border-radius: 50%; width: 22px; height: 22px; display: none; align-items: center; justify-content: center; font-size: 0.8rem; font-weight: bold; border: 2px solid white; }
        .task-card.completed .check-badge { display: flex; }

        .progress-box { background: white; border-radius: 20px; padding: 15px; max-width: 470px; margin: 0 auto 25px auto; box-shadow: 0 6px 15px rgba(0,0,0,0.05); border: 2px solid #FFE0E6; }
        .progress-text { font-size: 1rem; font-weight: bold; margin-bottom: 10px; color: #555; }
        .star-row { display: flex; justify-content: center; font-size: 1.8rem; margin-bottom: 5px; flex-wrap: wrap; gap: 10px; }
        .star-slot { color: #E0E0E0; transition: all 0.3s; transform: scale(0.9); }
        .star-slot.active { color: var(--gold); text-shadow: 0 0 10px rgba(255,215,0,0.6); animation: pop 0.3s ease-in-out; transform: scale(1.1); }

        .round-badge { background: var(--primary-color); color: white; padding: 3px 10px; border-radius: 12px; font-size: 0.8rem; font-weight: bold; margin-left: 5px; vertical-align: middle; }

        .showcase-box { background: #FFF; border-radius: 25px; padding: 15px; max-width: 470px; margin: 0 auto; border: 3px dashed var(--primary-color); min-height: 120px; }
        .badge-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-top: 10px; }
        .collected-badge {
            background: #FFF9FA; border: 2px solid #FFE0E6; border-radius: 15px; padding: 8px; font-size: 1.8rem;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            box-shadow: inset 0 0 5px rgba(0,0,0,0.02); animation: pop 0.4s ease-in-out;
        }
        .badge-label { font-size: 0.7rem; color: #888; margin-top: 3px; font-weight: bold; white-space: nowrap; }
        .empty-text { color: #BBB; font-size: 0.9rem; margin-top: 40px; font-style: italic; }

        .admin-panel { background: #F5F5F5; border: 2px solid #DDD; border-radius: 15px; padding: 15px; max-width: 470px; margin: 40px auto 10px auto; }
        .admin-title { font-size: 0.9rem; font-weight: bold; color: #666; margin-bottom: 10px; }
        .admin-btn { background: #78909C; color: white; border: none; padding: 8px 15px; font-size: 0.85rem; border-radius: 8px; cursor: pointer; margin: 5px; font-weight: bold; }
        .admin-btn.warning { background: #FFA000; }
        .admin-btn.danger { background: #E53935; }

        @keyframes pop { 0% { transform: scale(0.5); } 100% { transform: scale(1); } }
        button { -webkit-tap-highlight-color: transparent; }
    </style>
</head>
<body>

    <audio id="sndPop" src="https://assets.mixkit.co/active_storage/sfx/2568/2568-84.wav" preload="auto"></audio>
    <audio id="sndSuccess" src="https://assets.mixkit.co/active_storage/sfx/1435/1435-84.wav" preload="auto"></audio>

    <h1>👑 寶貝的榮譽徽章收藏館 👑</h1>
    <div class="subtitle">每天做好生活小事情，就能累積星星換美麗徽章唷！</div>

    <div class="section-title">✨ 今日好習慣挑戰</div>
    <div class="task-container">
        <button class="task-card" id="task_teeth" onclick="toggleTask('task_teeth')">
            <div class="check-badge">✓</div>
            <div class="task-icon">🦷</div>
            <div class="task-name">乖乖刷牙</div>
        </button>
        <button class="task-card" id="task_bath" onclick="toggleTask('task_bath')">
            <div class="check-badge">✓</div>
            <div class="task-icon">🛁</div>
            <div class="task-name">開心洗澡</div>
        </button>
        <button class="task-card" id="task_eat" onclick="toggleTask('task_eat')">
            <div class="check-badge">✓</div>
            <div class="task-icon">🥣</div>
            <div class="task-name">把飯吃光</div>
        </button>
        <button class="task-card" id="task_toys" onclick="toggleTask('task_toys')">
            <div class="check-badge">✓</div>
            <div class="task-icon">🧸</div>
            <div class="task-name">收拾玩具</div>
        </button>
        <button class="task-card" id="task_sleep" onclick="toggleTask('task_sleep')">
            <div class="check-badge">✓</div>
            <div class="task-icon">🛏️</div>
            <div class="task-name">乖乖睡覺</div>
        </button>
    </div>

    <div class="progress-box">
        <div class="progress-text" id="progressText">🌟 再得到 5 顆星星就可以抽徽章囉！</div>
        <div class="star-row" id="starRow">
            <div class="star-slot">☆</div>
            <div class="star-slot">☆</div>
            <div class="star-slot">☆</div>
            <div class="star-slot">☆</div>
            <div class="star-slot">☆</div>
        </div>
    </div>

    <div class="section-title">
        🏆 我的皇家徽章展示櫃 (<span id="badgeCount">0</span>)
        <span class="round-badge" id="roundLevelLabel">第 1 輪 (Lv.1)</span>
    </div>
    <div class="showcase-box">
        <div id="emptyMessage" class="empty-text">目前還沒有徽章，跟著爸爸媽媽一起努力吧！</div>
        <div class="badge-grid" id="badgeGrid"></div>
    </div>

    <div class="admin-panel">
        <div class="admin-title">🛠️ 爸爸媽媽測試控制台</div>
        <button class="admin-btn" onclick="testUnlockTasks()">🔓 解鎖今日任務</button>
        <button class="admin-btn" onclick="testFastAddStar()">⭐ 快速直接+1星</button>
        <button class="admin-btn warning" onclick="fixDuplicateBadges()">🔧 修正重複徽章</button>
        <button class="admin-btn danger" onclick="testResetAll()">🧹 徹底重置</button>
    </div>

    <script>
        const BADGE_POOL = {
            round1: [
                { icon: '👸', name: '白雪公主' }, { icon: '🧜‍♀️', name: '美人魚' }, 
                { icon: '🧚‍♀️', name: '奇妙仙子' }, { icon: '👑', name: '閃亮皇冠' },
                { icon: '💎', name: '夢幻粉鑽' }, { icon: '🏰', name: '夢幻城堡' }, 
                { icon: '🪄', name: '魔法神棒' }, { icon: '🩰', name: '芭蕾舞鞋' }, 
                { icon: '🐱', name: '皇室小貓' }, { icon: '🕊️', name: '和平白鴿' }
            ],
            round2: [
                { icon: '🐶', name: '皇家小狗' }, { icon: '🐰', name: '魔法毛兔' }, 
                { icon: '🐻', name: '守護泰迪' }, { icon: '🐼', name: '功夫熊貓' }, 
                { icon: '🦊', name: '聰明小狐' }, { icon: '🐿️', name: '幸運松鼠' },
                { icon: '🦁', name: '勇敢小獅' }, { icon: '🐥', name: '元氣小雞' }
            ],
            round3Plus: [
                { icon: '🦄', name: '彩虹獨角獸' }, { icon: '🌈', name: '七彩幸福虹' }, 
                { icon: '🍓', name: '皇家草莓' }, { icon: '🍦', name: '甜心冰淇淋' }, 
                { icon: '🌟', name: '許願流星' }, { icon: '🎨', name: '小小藝術家' },
                { icon: '🎈', name: '夢想氣球' }
            ]
        };

        let currentStars = parseInt(localStorage.getItem('baby_stars_count')) || 0;
        let collectedBadges = JSON.parse(localStorage.getItem('baby_badges_list')) || [];
        let taskState = JSON.parse(localStorage.getItem('baby_tasks_today')) || { date: '', task_teeth: false, task_bath: false, task_eat: false, task_toys: false, task_sleep: false };

        const todayStr = new Date().toDateString();
        if (taskState.date !== todayStr) {
            taskState = { date: todayStr, task_teeth: false, task_bath: false, task_eat: false, task_toys: false, task_sleep: false };
            localStorage.setItem('baby_tasks_today', JSON.stringify(taskState));
        }

        updateUI();

        // 🧠 核心邏輯：配合妳的換大禮物點數規則 (第1輪10點換=2個徽章, 第2輪20點換=再加4個徽章, 第3輪30點換=再加6個徽章...)
        // 算出當前屬於第幾輪大禮物挑戰
        function getCurrentGiftRound() {
            const count = collectedBadges.length;
            if (count < 2) return 1;       // 0~1 個徽章：第一輪 (目標集滿 2 個 = 10點)
            if (count < 6) return 2;       // 2~5 個徽章：第二輪 (目標再集 4 個 = 20點)
            if (count < 12) return 3;      // 6~11 個徽章：第三輪 (目標再集 6 個 = 30點)
            return Math.floor((count - 12) / 8) + 4; // 後續以此類推
        }

        function toggleTask(taskId) {
            if (taskState[taskId]) return;
            playSound('sndPop');
            taskState[taskId] = true;
            localStorage.setItem('baby_tasks_today', JSON.stringify(taskState));
            addStar();
        }

        function addStar() {
            currentStars++;
            // 🌟 核心修改：抽卡門檻永遠調回 5 顆星！
            if (currentStars >= 5) {
                currentStars = 0;
                localStorage.setItem('baby_stars_count', currentStars);
                playSound('sndSuccess');
                setTimeout(rewardBadge, 600);
            } else {
                localStorage.setItem('baby_stars_count', currentStars);
                updateUI();
            }
        }

        function rewardBadge() {
            const giftRound = getCurrentGiftRound();
            
            // 根據大禮物輪數決定卡池豐富度
            let availablePool = [...BADGE_POOL.round1];
            if (giftRound >= 2) availablePool = availablePool.concat(BADGE_POOL.round2);
            if (giftRound >= 3) availablePool = availablePool.concat(BADGE_POOL.round3Plus);

            // 抓出「當前這一階段」已經抽到的徽章，確保不重複
            let stageStart = 0;
            if (giftRound === 2) stageStart = 2;
            if (giftRound === 3) stageStart = 6;
            if (giftRound >= 4) stageStart = 12;

            const thisStageCollectedNames = collectedBadges.slice(stageStart).map(b => b.name);
            let uncollected = availablePool.filter(badge => !thisStageCollectedNames.includes(badge.name));

            if (uncollected.length === 0) uncollected = availablePool;

            const randomIndex = Math.floor(Math.random() * uncollected.length);
            const newBadge = uncollected[randomIndex];
            
            collectedBadges.push(newBadge);
            localStorage.setItem('baby_badges_list', JSON.stringify(collectedBadges));
            
            updateUI();
            confetti({ particleCount: 180, spread: 100, origin: { y: 0.5 } });

            setTimeout(() => {
                const count = collectedBadges.length;
                // 檢查是否剛好達到換禮物的門檻（2個、6個、12個徽章）
                if (count === 2) {
                    alert(`👑 🎉 太棒了！！！\n妳成功集滿了第一輪的 10 點（2個徽章）！\n快去找爸爸媽媽換第一輪的大禮物囉！！！🎁✨\n下一關開啟第二輪（目標集 20 點），會加入新徽章唷！`);
                } else if (count === 6) {
                    alert(`👑 🎉 哇啊啊！不可思議！！！\n妳成功集滿了第二輪的 20 點（再得 4 個徽章）！\n快去找爸爸媽媽換第二輪的超級大禮物囉！！！🎁🧸\n下一關開啟第三輪（目標集 30 點）！`);
                } else if (count === 12) {
                    alert(`👑 🎉 天啊！妳是榮譽小達人！！！\n妳成功集滿了第三輪的 30 點（再得 6 個徽章）！\n快去抱抱爸爸媽媽換究極大禮物囉！！！🎁✨`);
                } else {
                    alert(`🎉 太棒了！妳表現得超級好！\n獲得了一個全新徽章【${newBadge.icon} ${newBadge.name}】！\n明天也要繼續加油唷！`);
                }
            }, 300);
        }

        function updateUI() {
            document.getElementById('task_teeth').className = 'task-card' + (taskState.task_teeth ? ' completed' : '');
            document.getElementById('task_bath').className = 'task-card' + (taskState.task_bath ? ' completed' : '');
            document.getElementById('task_eat').className = 'task-card' + (taskState.task_eat ? ' completed' : '');
            document.getElementById('task_toys').className = 'task-card' + (taskState.task_toys ? ' completed' : '');
            document.getElementById('task_sleep').className = 'task-card' + (taskState.task_sleep ? ' completed' : '');

            const giftRound = getCurrentGiftRound();
            
            // 顯示目前是在大禮物的第幾輪
            document.getElementById('roundLevelLabel').innerText = `大禮物第 ${giftRound} 輪`;

            // 🌟 星星格子永遠固定顯示 5 個
            const starRow = document.getElementById('starRow');
            starRow.innerHTML = '';
            for (let index = 0; index < 5; index++) {
                const slot = document.createElement('div');
                if (index < currentStars) {
                    slot.className = 'star-slot active'; slot.innerText = '★';
                } else {
                    slot.className = 'star-slot'; slot.innerText = '☆';
                }
                starRow.appendChild(slot);
            }

            document.getElementById('progressText').innerText = `🌟 再得到 ${5 - currentStars} 顆星星就可以抽徽章囉！`;

            const badgeGrid = document.getElementById('badgeGrid');
            const emptyMessage = document.getElementById('emptyMessage');
            document.getElementById('badgeCount').innerText = collectedBadges.length;

            badgeGrid.innerHTML = '';
            if (collectedBadges.length === 0) {
                emptyMessage.style.display = 'block';
            } else {
                emptyMessage.style.display = 'none';
                collectedBadges.forEach(badge => {
                    const badgeEl = document.createElement('div');
                    badgeEl.className = 'collected-badge';
                    badgeEl.innerHTML = `<div>${badge.icon}</div><div class="badge-label">${badge.name}</div>`;
                    badgeGrid.appendChild(badgeEl);
                });
            }
        }

        function playSound(audioId) {
            try {
                const snd = document.getElementById(audioId);
                if (snd) { snd.currentTime = 0; snd.play().catch(err => console.log(err)); }
            } catch (e) { console.log(e); }
        }

        function fixDuplicateBadges() {
            if (collectedBadges.length < 2) return;
            let hasChange = false;
            for (let i = 0; i < collectedBadges.length; i++) {
                for (let j = i + 1; j < collectedBadges.length; j++) {
                    if (collectedBadges[i].name === collectedBadges[j].name) {
                        const currentNames = collectedBadges.map(b => b.name);
                        const candidates = BADGE_POOL.round1.concat(BADGE_POOL.round2).filter(b => !currentNames.includes(b.name));
                        if (candidates.length > 0) {
                            collectedBadges[j] = candidates[0];
                            hasChange = true;
                        }
                    }
                }
            }
            if (hasChange) {
                localStorage.setItem('baby_badges_list', JSON.stringify(collectedBadges));
                updateUI();
                alert("✨ 修正成功！");
            } else {
                alert("目前展示櫃裡很完美，沒有重複的徽章唷！");
            }
        }

        function testUnlockTasks() {
            taskState = { date: new Date().toDateString(), task_teeth: false, task_bath: false, task_eat: false, task_toys: false, task_sleep: false };
            localStorage.setItem('baby_tasks_today', JSON.stringify(taskState));
            updateUI();
        }

        function testFastAddStar() { playSound('sndPop'); addStar(); }

        function testResetAll() {
            if(confirm("確定要清除所有測試徽章與點數，完全重新開始嗎？")) {
                currentStars = 0; collectedBadges = [];
                taskState = { date: new Date().toDateString(), task_teeth: false, task_bath: false, task_eat: false, task_toys: false, task_sleep: false };
                localStorage.removeItem('baby_stars_count'); localStorage.removeItem('baby_badges_list'); localStorage.removeItem('baby_tasks_today');
                updateUI();
            }
        }
    </script>
</body>
</html>
