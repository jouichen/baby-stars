<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>我們的家庭共同記帳本</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="家庭記帳">
    <link rel="apple-touch-icon" href="icon.png">

    <style>
        :root {
            --bg-color: #F0F4F8;
            --primary: #4A90E2; 
            --border-color: #D6E4F0;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif;
            background-color: var(--bg-color);
            margin: 0; padding: 15px; color: #4A4A4A; text-align: center;
        }
        h1 { color: var(--primary); font-size: 1.6rem; margin: 10px 0 5px 0; }
        .subtitle { font-size: 0.9rem; color: #777; margin-bottom: 20px; }
        
        .card {
            background: white; border-radius: 20px; padding: 15px;
            max-width: 450px; margin: 0 auto 15px auto;
            box-shadow: 0 6px 15px rgba(0,0,0,0.05); border: 2px solid var(--border-color);
        }
        
        .amount-display { font-size: 2.2rem; font-weight: bold; color: var(--primary); margin: 5px 0; }
        .input-box { width: 100%; padding: 12px; font-size: 1.3rem; border: 2px solid var(--border-color); border-radius: 12px; text-align: center; font-weight: bold; color: #4A4A4A; margin-bottom: 15px; }
        .input-box:focus { border-color: var(--primary); outline: none; }
        
        .category-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 10px; }
        .cat-btn {
            background: white; border: 2px solid var(--border-color); border-radius: 15px;
            padding: 10px; cursor: pointer; transition: all 0.2s;
        }
        .cat-btn:active { transform: scale(0.95); background: #F4F8FA; }
        .cat-icon { font-size: 1.8rem; margin-bottom: 3px; }
        .cat-name { font-size: 0.85rem; font-weight: bold; color: #555; }

        .sync-status { font-size: 0.8rem; color: #999; margin-top: 5px; }
        .refresh-btn { background: #78909C; color: white; border: none; padding: 6px 12px; font-size: 0.8rem; border-radius: 20px; cursor: pointer; font-weight: bold; margin-top: 5px; }
    </style>
</head>
<body>

    <h1>🏡 我們的家庭共同記帳本 🏡</h1>
    <div class="subtitle">雲端雙人即時同步，一起經營我們溫馨的家！</div>

    <div class="card">
        <div style="font-size: 0.9rem; color: #777; font-weight: bold;">☁️ 今日家庭累計支出</div>
        <div class="amount-display">$ <span id="cloudTotal">0</span></div>
        <div class="sync-status" id="syncStatus">正在從雲端同步最新帳目...</div>
        <button class="refresh-btn" onclick="fetchCloudTotal()">🔄 手動重新整理雲端</button>
    </div>

    <div class="card">
        <input type="number" id="amountInput" class="input-box" placeholder="輸入金額 (例如: 250)" inputmode="numeric">
        
        <div class="category-grid">
            <button class="cat-btn" onclick="sendToCloud('🛒', '買菜/超市')">
                <div class="cat-icon">🛒</div><div class="cat-name">買菜/超市</div>
            </button>
            <button class="cat-btn" onclick="sendToCloud('🍔', '外食/餐廳')">
                <div class="cat-icon">🍔</div><div class="cat-name">外食/餐廳</div>
            </button>
            <button class="cat-btn" onclick="sendToCloud('⚡', '水電/固定開銷')">
                <div class="cat-icon">⚡</div><div class="cat-name">水電/開銷</div>
            </button>
            <button class="cat-btn" onclick="sendToCloud('👶', '育兒/寶貝')">
                <div class="cat-icon">👶</div><div class="cat-name">育兒/寶貝</div>
            </button>
            <button class="cat-btn" onclick="sendToCloud('🚗', '加油/交通')">
                <div class="cat-icon">🚗</div><div class="cat-name">交通</div>
            </button>
            <button class="cat-btn" onclick="sendToCloud('✨', '其他支出')">
                <div class="cat-icon">✨</div><div class="cat-name">其他</div>
            </button>
        </div>
    </div>

    <script>
        // 🎯 經解析後百分之百精準的設定值
        const GOOGLE_FORM_URL = "https://docs.google.com/forms/d/e/1FAIpQLSdEdgUe4v1uMxAzEkVkjFpb-DbE4imU5zMhV_MPZD1FKQRnMQ/formResponse";
        const GOOGLE_SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQXop8A33xFA2m-wyD4p1uhd_IgE118reLfZTyMbqvLnEscWujvbJTWICQAoor1y1XPFCXq4E7fhF5v/pub?output=csv";

        const ENTRY_DATE = "entry.404542770";    // 日期 
        const ENTRY_ITEM = "entry.880135335";    // 項目
        const ENTRY_AMOUNT = "entry.1179564707"; // 金額

        // 網頁開啟時，自動去雲端抓取今日總金額
        fetchCloudTotal();

        // 🧠 核心功能一：把資料遠端傳送到 Google 表單
        function sendToCloud(icon, category) {
            const amountInput = document.getElementById('amountInput');
            const amount = parseInt(amountInput.value);

            if (!amount || amount <= 0) {
                alert("請先輸入金額唷！");
                return;
            }

            document.getElementById('syncStatus').innerText = "⚡ 正在同步至雲端...";
            
            // 修正點一：標準化日期格式，讓寫入與讀取時格式完全同步為 YYYY-MM-DD
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            const targetDateStr = `${year}-${month}-${day}`;

            // 修正點二：改用 URLSearchParams 傳送標準表單封包，Google 才會接收
            const params = new URLSearchParams();
            params.append(ENTRY_DATE, targetDateStr);
            params.append(ENTRY_ITEM, icon + " " + category);
            params.append(ENTRY_AMOUNT, amount);

            // 默默發送給 Google 表單
            fetch(GOOGLE_FORM_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded'
                },
                body: params.toString()
            }).then(() => {
                document.getElementById('syncStatus').innerText = "✅ 成功寫入雲端！更新中...";
                amountInput.value = '';
                amountInput.blur();
                
                // 延遲 2 秒等待 Google 後台處理完畢，自動重新抓取最新總額
                setTimeout(fetchCloudTotal, 2000);
            }).catch(err => {
                alert("雲端傳送失敗，請檢查網路或設定！");
                console.error(err);
            });
        }

        // 🧠 核心功能二：從 Google 試算表讀取今日加總
        function fetchCloudTotal() {
            // 統一讀取與比對格式 (補零的橫線格式：YYYY-MM-DD)
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            const todayStr = `${year}-${month}-${day}`;

            // 讀取 Google 試算表的公開 CSV 資料並強制清除緩存
            fetch(GOOGLE_SHEET_CSV_URL + (GOOGLE_SHEET_CSV_URL.includes('?') ? '&' : '?') + "clearCache=" + new Date().getTime())
                .then(response => response.text())
                .then(text => {
                    const lines = text.split("\n");
                    let todayTotal = 0;

                    for (let i = 1; i < lines.length; i++) {
                        if (!lines[i].trim()) continue;
                        
                        const columns = lines[i].split(",");
                        if (columns.length >= 4) {
                            // 修正點三：相容 Google 寫入時可能帶有的各種日期格式間距
                            let dateInRow = columns[1].replace(/"/g, '').trim(); 
                            const amountInRow = parseInt(columns[3].replace(/"/g, '').trim()) || 0;
                            
                            // 統一將資料庫讀出來的斜線 / 換成橫線 -，並進行補零正規化比對
                            if (dateInRow.includes('/')) {
                                const parts = dateInRow.split('/');
                                if(parts.length === 3) {
                                    dateInRow = `${parts[0]}-${parts[1].padStart(2, '0')}-${parts[2].padStart(2, '0')}`;
                                }
                            }
                            
                            if (dateInRow === todayStr) {
                                todayTotal += amountInRow;
                            }
                        }
                    }

                    document.getElementById('cloudTotal').innerText = todayTotal.toLocaleString('zh-TW');
                    document.getElementById('syncStatus').innerText = `☁️ 雲端同步成功 (最後更新: ${new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})})`;
                })
                .catch(err => {
                    document.getElementById('syncStatus').innerText = "❌ 無法讀取雲端總額，請確認試算表已發布";
                    console.error(err);
                });
        }
    </script>
</body>
</html>
