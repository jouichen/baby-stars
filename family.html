<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>我們的家庭共同記帳本</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="家庭記帳">
    <link rel="apple-touch-icon" href="my-icon.png">

    <style>
        :root {
            --bg-color: #F0F4F8;
            --primary: #4A90E2; 
            --secondary: #E67E22; 
            --border-color: #D6E4F0;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body {
            font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif;
            background-color: var(--bg-color);
            margin: 0; padding: 15px; color: #4A4A4A; text-align: center;
        }
        h1 { color: var(--primary); font-size: 1.6rem; margin: 10px 0 5px 0; }
        .subtitle { font-size: 0.9rem; color: #777; margin-bottom: 20px; }
        
        .card {
            background: white; border-radius: 20px; padding: 15px;
            max-width: 450px; margin: 0 auto 15px auto;
            box-shadow: 0 6px 15px rgba(0,0,0,0.05); border: 2px solid var(--border-color);
        }
        
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 5px 0; }
        .stat-box { background: #F8FAFC; padding: 10px; border-radius: 12px; border: 1px solid #E2E8F0; }
        .stat-label { font-size: 0.8rem; color: #777; font-weight: bold; margin-bottom: 3px; }
        .amount-display { font-size: 1.5rem; font-weight: bold; color: var(--primary); }
        .amount-display.month { color: var(--secondary); }
        
        /* 調整輸入框：改為 text 型態以支援輸入備註，placeholder 增加提示 */
        .input-box { width: 100%; padding: 12px; font-size: 1.2rem; border: 2px solid var(--border-color); border-radius: 12px; text-align: center; font-weight: bold; color: #4A4A4A; margin-bottom: 10px; }
        .input-box:focus { border-color: var(--primary); outline: none; }
        
        .helper-row { display: flex; justify-content: center; align-items: center; gap: 5px; margin-bottom: 15px; font-size: 0.9rem; color: #666; font-weight: bold; }
        .helper-row input[type="checkbox"] { width: 16px; height: 16px; cursor: pointer; }

        .category-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 5px; }
        .cat-btn {
            background: white; border: 1.5px solid var(--border-color); border-radius: 12px;
            padding: 8px 4px; cursor: pointer; transition: all 0.2s;
        }
        .cat-btn:active { transform: scale(0.95); background: #F4F8FA; }
        .cat-icon { font-size: 1.5rem; margin-bottom: 2px; }
        .cat-name { font-size: 0.75rem; font-weight: bold; color: #555; white-space: nowrap; }

        .sync-status { font-size: 0.8rem; color: #999; margin-top: 8px; }
        .refresh-btn { background: #78909C; color: white; border: none; padding: 6px 12px; font-size: 0.8rem; border-radius: 20px; cursor: pointer; font-weight: bold; margin-top: 5px; }

        .history-title { text-align: left; font-size: 0.95rem; font-weight: bold; color: #555; margin: 5px 0 10px 5px; display: flex; justify-content: space-between; }
        .history-list { max-height: 220px; overflow-y: auto; padding-right: 3px; }
        .history-item { display: flex; justify-content: space-between; align-items: center; padding: 10px 8px; border-bottom: 1px dashed #EEF2F6; font-size: 0.9rem; }
        .history-item:last-child { border-bottom: none; }
        .item-date { color: #999; font-size: 0.75rem; font-family: monospace; }
        .item-name { font-weight: 500; color: #444; margin-left: 8px; flex-grow: 1; text-align: left; }
        .item-amount { font-weight: bold; color: #E53935; }
    </style>
</head>
<body>

    <h1>🏡 我們的家庭共同記帳本 🏡</h1>
    <div class="subtitle">雲端雙人即時同步，一起經營我們溫馨的家！</div>

    <div class="card">
        <div class="stats-grid">
            <div class="stat-box">
                <div class="stat-label">💰 今日累計支出</div>
                <div class="amount-display">$ <span id="cloudTotal">0</span></div>
            </div>
            <div class="stat-box">
                <div class="stat-label">📅 <span id="monthLabel">本月</span>累計支出</div>
                <div class="amount-display month">$ <span id="monthTotal">0</span></div>
            </div>
        </div>
        <div class="sync-status" id="syncStatus">正在從雲端同步最新帳目...</div>
        <button class="refresh-btn" onclick="fetchCloudTotal()">🔄 手動重新整理雲端</button>
    </div>

    <div class="card">
        <input type="text" id="amountInput" class="input-box" placeholder="輸入金額 (如: 1000 水彩課)">
        
        <div class="helper-row">
            <input type="checkbox" id="yesterdayCheck">
            <label id="yesterdayLabel" for="yesterdayCheck">補記昨天的帳</label>
        </div>
        
        <div class="category-grid">
            <button class="cat-btn" onclick="sendToCloud('🏠', '房屋貸款')">
                <div class="cat-icon">🏠</div><div class="cat-name">房屋貸款</div>
            </button>
            <button class="cat-btn" onclick="sendToCloud('📚', '小孩學費')">
                <div class="cat-icon">📚</div><div class="cat-name">小孩學費</div>
            </button>
            <button class="cat-btn" onclick="sendToCloud('🛒', '食材買菜')">
                <div class="cat-icon">🛒</div><div class="cat-name">食材買菜</div>
            </button>
            <button class="cat-btn" onclick="sendToCloud('🍳', '早餐/早午餐')">
                <div class="cat-icon">🍳</div><div class="cat-name">早餐</div>
            </button>

            <button class="cat-btn" onclick="sendToCloud('🍱', '午餐/便當')">
                <div class="cat-icon">🍱</div><div class="cat-name">午餐</div>
            </button>
            <button class="cat-btn" onclick="sendToCloud('🍜', '晚餐/覓食')">
                <div class="cat-icon">🍜</div><div class="cat-name">晚餐</div>
            </button>
            <button class="cat-btn" onclick="sendToCloud('☕', '飲料/咖啡')">
                <div class="cat-icon">☕</div><div class="cat-name">飲料咖啡</div>
            </button>
            <button class="cat-btn" onclick="sendToCloud('🍓', '水果/零食')">
                <div class="cat-icon">🍓</div><div class="cat-name">水果零食</div>
            </button>

            <button class="cat-btn" onclick="sendToCloud('🧻', '生活用品')">
                <div class="cat-icon">🧻</div><div class="cat-name">日用品</div>
            </button>
            <button class="cat-btn" onclick="sendToCloud('👶', '育兒/寶貝')">
                <div class="cat-icon">👶</div><div class="cat-name">育兒寶貝</div>
            </button>
            <button class="cat-btn" onclick="sendToCloud('🎁', '娛樂/聚餐')">
                <div class="cat-icon">🎁</div><div class="cat-name">娛樂聚餐</div>
            </button>
            <button class="cat-btn" onclick="sendToCloud('✨', '其他雜支')">
                <div class="cat-icon">✨</div><div class="cat-name">其他雜支</div>
            </button>
        </div>
    </div>

    <div class="card" style="padding-bottom: 10px;">
        <div class="history-title">
            <span>📝 近期消費明細 (含日期)</span>
            <span style="font-size: 0.75rem; color: #999; font-weight: normal;">顯示最新 15 筆</span>
        </div>
        <div class="history-list" id="historyList">
            <div style="color: #bbb; font-size: 0.85rem; padding: 20px 0;">暫無明細資料</div>
        </div>
    </div>

    <script>
        const GOOGLE_FORM_URL = "https://docs.google.com/forms/d/e/1FAIpQLSdEdgUe4v1uMxAzEkVkjFpb-DbE4imU5zMhV_MPZD1FKQRnMQ/formResponse";
        const GOOGLE_SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vQXop8A33xFA2m-wyD4p1uhd_IgE118reLfZTyMbqvLnEscWujvbJTWICQAoor1y1XPFCXq4E7fhF5v/pub?output=csv";

        const ENTRY_DATE = "entry.404542770";    
        const ENTRY_ITEM = "entry.880135335";    
        const ENTRY_AMOUNT = "entry.1179564707"; 

        fetchCloudTotal();
        updateYesterdayLabel();

        function updateYesterdayLabel() {
            const yesterday = new Date();
            yesterday.setDate(yesterday.getDate() - 1);
            const m = yesterday.getMonth() + 1;
            const d = yesterday.getDate();
            document.getElementById('yesterdayLabel').innerText = `補記昨天的帳 (${m}/${d})`;
        }

        // 🧠 核心升級：解析輸入框內的數字與文字
        function sendToCloud(icon, category) {
            const amountInput = document.getElementById('amountInput');
            const yesterdayCheck = document.getElementById('yesterdayCheck');
            const rawValue = amountInput.value.trim();

            if (!rawValue) {
                alert("請先輸入金額唷！");
                return;
            }

            // 使用正則表達式，自動抓出開頭的數字作為金額，後面剩下的當作備註
            const amountMatch = rawValue.match(/^(\d+)/);
            if (!amountMatch) {
                alert("請在輸入框開頭輸入正確的數字金額唷！(例如: 1000 水彩課)");
                return;
            }

            const amount = parseInt(amountMatch[1]);
            // 抓取金額後面的所有文字作為備註
            let note = rawValue.substring(amountMatch[1].length).trim();
            // 清理掉使用者可能順手打的符號如斜線、空格、逗號
            note = note.replace(/^[\s\/,，_-]+/, ""); 

            document.getElementById('syncStatus').innerText = "⚡ 正在同步至雲端...";
            
            const targetDate = new Date();
            if (yesterdayCheck.checked) {
                targetDate.setDate(targetDate.getDate() - 1);
            }

            const year = targetDate.getFullYear();
            const month = String(targetDate.getMonth() + 1).padStart(2, '0');
            const day = String(targetDate.getDate()).padStart(2, '0');
            const targetDateStr = `${year}-${month}-${day}`;

            // 如果有備註，就將品項包裝成「📚 小孩學費 (水彩課)」
            const finalItemName = note ? `${icon} ${category} (${note})` : `${icon} ${category}`;

            const params = new URLSearchParams();
            params.append(ENTRY_DATE, targetDateStr);
            params.append(ENTRY_ITEM, finalItemName);
            params.append(ENTRY_AMOUNT, amount);

            fetch(GOOGLE_FORM_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded'
                },
                body: params.toString()
            }).then(() => {
                document.getElementById('syncStatus').innerText = "✅ 成功寫入雲端！更新中...";
                amountInput.value = '';
                amountInput.blur();
                yesterdayCheck.checked = false;
                setTimeout(fetchCloudTotal, 2000);
            }).catch(err => {
                alert("雲端傳送失敗，請檢查網路或設定！");
                console.error(err);
            });
        }

        function fetchCloudTotal() {
            const now = new Date();
            const currentYear = now.getFullYear();
            const currentMonth = now.getMonth(); 

            document.getElementById('monthLabel').innerText = `${currentMonth + 1}月`;

            fetch(GOOGLE_SHEET_CSV_URL + (GOOGLE_SHEET_CSV_URL.includes('?') ? '&' : '?') + "clearCache=" + new Date().getTime())
                .then(response => response.text())
                .then(text => {
                    const lines = text.split("\n");
                    let todayTotal = 0;
                    let monthTotal = 0; 
                    let records = [];

                    for (let i = 1; i < lines.length; i++) {
                        if (!lines[i].trim()) continue;
                        
                        const columns = lines[i].split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/);
                        
                        if (columns.length >= 4) {
                            let dateRaw = columns[1].replace(/"/g, '').trim(); 
                            let itemRaw = columns[2].replace(/"/g, '').trim();
                            const amountInRow = parseInt(columns[3].replace(/"/g, '').trim()) || 0;
                            
                            const dateParts = dateRaw.match(/\d+/g);
                            
                            if (dateParts && dateParts.length >= 3) {
                                let rYear = parseInt(dateParts[0]);
                                let rMonth = parseInt(dateParts[1]) - 1; 
                                let rDay = parseInt(dateParts[2]);
                                
                                if (rYear < 100) rYear += 2000; 

                                if (rYear === currentYear && rMonth === currentMonth && rDay === now.getDate()) {
                                    todayTotal += amountInRow;
                                }

                                if (rYear === currentYear && rMonth === currentMonth) {
                                    monthTotal += amountInRow;
                                }

                                const displayMonth = String(rMonth + 1).padStart(2, '0');
                                const displayDay = String(rDay).padStart(2, '0');
                                records.push({
                                    dateLabel: `${displayMonth}/${displayDay}`,
                                    item: itemRaw,
                                    amount: amountInRow
                                });
                            }
                        }
                    }

                    document.getElementById('cloudTotal').innerText = todayTotal.toLocaleString('zh-TW');
                    document.getElementById('monthTotal').innerText = monthTotal.toLocaleString('zh-TW');
                    
                    records.reverse();
                    const listContainer = document.getElementById('historyList');
                    if (records.length > 0) {
                        const maxDisplay = records.slice(0, 15);
                        listContainer.innerHTML = maxDisplay.map(r => `
                            <div class="history-item">
                                <span class="item-date">${r.dateLabel}</span>
                                <span class="item-name">${r.item}</span>
                                <span class="item-amount">$${r.amount.toLocaleString('zh-TW')}</span>
                            </div>
                        `).join('');
                    } else {
                        listContainer.innerHTML = `<div style="color: #bbb; font-size: 0.85rem; padding: 20px 0;">暫無明細資料</div>`;
                    }

                    document.getElementById('syncStatus').innerText = `☁️ 雲端同步成功 (最後更新: ${new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'})})`;
                })
                .catch(err => {
                    document.getElementById('syncStatus').innerText = "❌ 無法讀取雲端總額，請確認試算表已發布";
                    console.error(err);
                });
        }
    </script>
</body>
</html>
